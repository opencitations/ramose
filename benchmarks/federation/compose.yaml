name: ramose-federation

services:
  index:
    image: adfreiburg/qlever@sha256:3d3959f9cd97ca70a5b878ba647c4671a059597db2472bc1850f3ada99124bf5
    platform: linux/amd64
    entrypoint: ["qlever-server"]
    command: ["-i", "/index/oc_index", "-j", "8", "-p", "7001", "-m", "4G", "-c", "0G", "-e", "0G", "-k", "0", "-s", "320s", "--no-metrics-log", "--no-resource-usage-log"]
    volumes:
      - ./data/index/db:/index:ro
    mem_limit: 6g
    cpus: 4
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7001'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  meta:
    image: openlink/virtuoso-opensource-7@sha256:44828bb88f0a55f21873b7c6b034436be33c58e74427a98e5de095fd0d4f4cc9
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        "$$VIRTUOSO_HOME/bin/inifile" +inifile virtuoso.ini +section Parameters +key NumberOfBuffers +value 340000
        "$$VIRTUOSO_HOME/bin/inifile" +inifile virtuoso.ini +section Parameters +key MaxDirtyBuffers +value 250000
        "$$VIRTUOSO_HOME/bin/inifile" +inifile virtuoso.ini +section Parameters +key MaxQueryMem +value 1073741824
        "$$VIRTUOSO_HOME/bin/inifile" +inifile virtuoso.ini +section Parameters +key MaxSortedTopRows +value 100000
        exec /virtuoso-entrypoint.sh start
    volumes:
      - ./data/meta/database:/database
    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8890'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ramose:
    image: ramose-federation-v2:local
    build:
      context: ../..
      dockerfile: benchmarks/federation/Dockerfile
    command:
      - python
      - -m
      - ramose
      - -s
      - /benchmark/operations.hf
      - -w
      - 0.0.0.0:8080
      - --no-cache
      - --retry-attempts
      - "1"
    volumes:
      - .:/benchmark:ro
    environment:
      PYTHONPATH: /benchmark
    mem_limit: 1g
    depends_on:
      index:
        condition: service_healthy
      meta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  ramose-v1:
    image: ramose-federation-v1:local
    build:
      context: .
      dockerfile: Dockerfile.v1
    command:
      - python
      - -m
      - ramose
      - -s
      - /benchmark/service-v1.hf
      - -w
      - 0.0.0.0:8081
    volumes:
      - .:/benchmark:ro
    environment:
      PYTHONPATH: /benchmark
    mem_limit: 1g
    depends_on:
      index:
        condition: service_healthy
      meta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  runner:
    image: ramose-federation-v2:local
    profiles: [tools]
    entrypoint: ["python", "/benchmark/benchmark.py"]
    volumes:
      - .:/benchmark:ro
      - ./results:/results
      - ./data:/data
    environment:
      RAMOSE_BENCHMARK_COMMIT: ${RAMOSE_BENCHMARK_COMMIT:-}
      RAMOSE_BENCHMARK_HOST: ${RAMOSE_BENCHMARK_HOST:-}
      RAMOSE_BENCHMARK_IMAGES: ${RAMOSE_BENCHMARK_IMAGES:-}
    mem_limit: 1g
