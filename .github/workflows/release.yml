name: Release

on:
  workflow_run:
    workflows: ["Test"]
    branches: [master]
    types:
      - completed

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit message
        id: check_message
        run: |
          git log -1 --pretty=%B > commit_message.txt
          if grep -q "\[release\]" commit_message.txt; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Install UV
        if: steps.check_message.outputs.should_release == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python
        if: steps.check_message.outputs.should_release == 'true'
        run: uv python install

      - name: Install dependencies
        if: steps.check_message.outputs.should_release == 'true'
        run: uv sync --locked

      - name: Setup Node.js
        if: steps.check_message.outputs.should_release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        if: steps.check_message.outputs.should_release == 'true'
        run: |
          npm install -g semantic-release
          npm install -g @semantic-release/git
          npm install -g @semantic-release/changelog
          npm install -g @semantic-release/exec

      - name: Create Release
        if: steps.check_message.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Build and publish to PyPI
        if: steps.check_message.outputs.should_release == 'true' && success()
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv build
          uv publish --token $UV_PUBLISH_TOKEN

      - name: Sync software citation metadata
        id: citation
        if: steps.check_message.outputs.should_release == 'true' && success()
        uses: arcangelo7/software-citation-sync@0b18b7e155e903db9661bb14d60e6f8a40e8c8cf # v2.0.1

      - name: Commit software citation metadata
        if: steps.check_message.outputs.should_release == 'true' && steps.citation.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff README.md
          git commit -m "docs: update software citation metadata"
          git push origin HEAD:master
