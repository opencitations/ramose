type:
  filter:
    journal: |-
      ?local_identifier a fabio:Journal .
    conference: |-
      ?local_identifier a fabio:AcademicProceedings .
    book: |-
      VALUES ?_book_type { fabio:Book fabio:ReferenceBook }
      ?local_identifier a ?_book_type .
    repository: "FILTER(false)"
    other: |-
      ?local_identifier a ?_other_type .
      FILTER(?_other_type NOT IN (fabio:Expression, fabio:Journal, fabio:AcademicProceedings, fabio:Book, fabio:ReferenceBook))
    unknown: "FILTER(false)"
identifiers.value:
  filter: '?local_identifier datacite:hasIdentifier [ literal:hasLiteralValue "{{value}}"^^<http://www.w3.org/2001/XMLSchema#string> ] .'
identifiers.scheme:
  filter: "?local_identifier datacite:hasIdentifier [ datacite:usesIdentifierScheme datacite:{{value}} ] ."
name:
  filter: "?local_identifier dcterms:title '{{value}}'. "
cf.search.name:
  filter: |-
    ?local_identifier dcterms:title ?name .
    { SELECT DISTINCT ?name WHERE { ?name <http://qlever.cs.uni-freiburg.de/builtin-functions/has-word> ?_word . FILTER STRSTARTS(?_word, "{{value}}") } }
