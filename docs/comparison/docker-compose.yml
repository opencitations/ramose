x-fuseki: &fuseki
  build: ./fuseki
  volumes:
    - ./data:/data:ro
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3030'"]
    interval: 2s
    timeout: 2s
    retries: 30

x-endpoints: &endpoints
  depends_on:
    meta:
      condition: service_healthy
    index:
      condition: service_healthy
    meta-basic:
      condition: service_healthy
    meta-digest:
      condition: service_healthy
    meta-write:
      condition: service_healthy
    meta-counted:
      condition: service_healthy
    meta-write-counted:
      condition: service_healthy

services:
  meta:
    <<: *fuseki
    command: ["--file=/data/meta.nt", "/sparql"]

  # A copy of Meta that asks for HTTP Basic credentials (demo:demo), used by the endpoint authentication tests.
  meta-basic:
    <<: *fuseki
    volumes:
      - ./data:/data:ro
      - ./fuseki/shiro.ini:/shiro.ini:ro
    command: ["--shiro=/shiro.ini", "--file=/data/meta.nt", "/sparql"]

  # A copy of Meta that asks for HTTP Digest credentials (demo:demo), used by the endpoint authentication tests.
  meta-digest:
    <<: *fuseki
    volumes:
      - ./data:/data:ro
      - ./fuseki/passwd:/passwd:ro
    command: ["--passwd=/passwd", "--auth=digest", "--file=/data/meta.nt", "/sparql"]

  index:
    <<: *fuseki
    command: ["--file=/data/index.nt", "/sparql"]

  meta-write:
    <<: *fuseki
    ports:
      - "3031:3030"
    command: ["--update", "--file=/data/meta.nt", "/sparql"]

  meta-counted:
    build: ./counter
    depends_on:
      meta:
        condition: service_healthy
    volumes:
      - ../../benchmarks/federation/proxy.py:/proxy.py:ro
    environment:
      PROXY_UPSTREAM: http://meta:3030
      PROXY_BACKEND: meta
    ports:
      - "7002:7002"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 7002), timeout=2).close()"]
      interval: 2s
      timeout: 2s
      retries: 30

  meta-write-counted:
    build: ./counter
    depends_on:
      meta-write:
        condition: service_healthy
    volumes:
      - ../../benchmarks/federation/proxy.py:/proxy.py:ro
    environment:
      PROXY_UPSTREAM: http://meta-write:3030
      PROXY_BACKEND: meta
    ports:
      - "7003:7002"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 7002), timeout=2).close()"]
      interval: 2s
      timeout: 2s
      retries: 30

  ramose:
    <<: *endpoints
    build:
      context: ../..
      dockerfile: docs/comparison/ramose/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./ramose/state:/app/state

  grlc:
    <<: *endpoints
    build: ./grlc
    ports:
      - "8082:8082"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  basil:
    <<: *endpoints
    build: ./basil
    ports:
      - "8080:8080"

  # R4R sends its GET queries with a JSON Content-Type header, which Fuseki rejects with 415,
  # so its requests pass through a proxy that drops the header.
  r4r-proxy:
    <<: *endpoints
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./r4r/proxy.conf:/etc/nginx/conf.d/default.conf:ro

  r4r:
    build: ./r4r
    depends_on:
      - r4r-proxy
    ports:
      - "8083:7777"
    environment:
      SPARQL_ENDPOINT: http://r4r-proxy/sparql
      RESOURCE_NAMESPACE: https://w3id.org/oc/meta/br/
      GRAPH_IRI: ""

  r4r-auth:
    build: ./r4r
    depends_on:
      - r4r-proxy
    ports:
      - "8084:7777"
    environment:
      SPARQL_ENDPOINT: http://r4r-proxy/sparql
      RESOURCE_NAMESPACE: https://w3id.org/oc/meta/br/
      GRAPH_IRI: ""
      API_USERS: "demo:demo"

  # CRAFTS sends a SPARQL Update in the query parameter, as Virtuoso accepts, while Fuseki follows
  # the SPARQL protocol and expects the update parameter, so its updates pass through a proxy that renames it.
  crafts-update-proxy:
    <<: *endpoints
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./crafts/update-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  crafts:
    build: ./crafts
    depends_on:
      - crafts-update-proxy
    ports:
      - "8085:8888"

  rdfproxy:
    <<: *endpoints
    build: ./rdfproxy
    ports:
      - "8086:8086"

  oba:
    <<: *endpoints
    build: ./oba
    ports:
      - "8087:8080"

  oba-write:
    <<: *endpoints
    build:
      context: ./oba
      args:
        OBA_CONFIG: config-write.yaml
    ports:
      - "8092:8080"

  elda:
    <<: *endpoints
    build: ./elda
    ports:
      - "8088:8080"

  walder:
    <<: *endpoints
    build: ./walder
    ports:
      - "8089:8089"

  shexpose:
    <<: *endpoints
    build: ./shexpose
    ports:
      - "8090:3000"

  shexpose-write:
    <<: *endpoints
    build: ./shexpose
    ports:
      - "8091:3000"
    volumes:
      - ./shexpose/write/config.yaml:/app/config/config.yaml:ro

  basil-init:
    image: python:3.13-alpine@sha256:420cd0bf0f3998275875e02ecd5808168cf0843cbb4d3c536432f729247b2acc
    user: root
    depends_on:
      - basil
    entrypoint: ["python", "/init/register.py"]
    environment:
      BASIL_BASE: http://basil:8080
    volumes:
      - ./basil/init:/init:ro
      - ./basil/state:/state
    restart: "no"
